<style>

  html, body { height: 100%; margin: 0; overflow: hidden; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }

  #scene.grabbing { cursor: grabbing; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; display: flex; justify-content: center;

  .main-btn { pointer-events: auto; font: 600 12px/1 var(--font-ui); letter-spacing: 0.02em; color: #f4f6f8; background: rgba(23, 33, 44, 0.8);

  #tag { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; background: rgba(247, 250, 253, 0.5); border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 8px; -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 4px 12px rgba(23, 33, 44, 0.08);
